<!doctype html><html><head><meta charset="utf-8"><title>Glitch</title><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Glitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen 3D canvas, floating HUD cards, one side panel (bottom sheet on phones). */
:root{
  --bg:#070910; --panel:#0e1322; --panel2:#151c33; --line:#26324f;
  --fg:#e9eefc; --mute:#8b97b8; --cyan:#2ee6ff; --pink:#ff3d9a; --lime:#b8ff3d; --amber:#ffb12e;
  --disp:'Chakra Petch','Trebuchet MS',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --top:calc(8px + env(safe-area-inset-top,0px)); --bot:calc(10px + env(safe-area-inset-bottom,0px));
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--disp);overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#gl.glitch{animation:glitch .6s steps(8) 1}
@keyframes glitch{0%{filter:none}20%{transform:translate(-6px,2px);filter:hue-rotate(90deg) saturate(2)}40%{transform:translate(5px,-3px);filter:hue-rotate(-60deg) contrast(1.4)}60%{transform:translate(-3px,0);filter:invert(.15)}100%{transform:none;filter:none}}
#fx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(ellipse at center,transparent 45%,var(--pink) 140%)}
#fx.on{opacity:.55}
.card{background:color-mix(in srgb,var(--panel) 82%,transparent);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tag{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);border:1px solid var(--cyan);border-radius:4px;padding:1px 5px}
.tag.demo{color:var(--amber);border-color:var(--amber)}
small{color:var(--mute);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
button{font:600 13px var(--disp);color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--cyan)} button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button.pri{background:var(--cyan);color:#021018;border-color:var(--cyan)} button.pri:hover{filter:brightness(1.1)}
button.up{background:var(--lime);color:#0a1400;border-color:var(--lime)} button.dn{background:var(--pink);color:#1a0010;border-color:var(--pink)}
button[disabled]{opacity:.4;cursor:not-allowed}
#tl{position:absolute;left:10px;top:var(--top);padding:10px 12px;min-width:190px}
#tl .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.bal{font:700 26px var(--mono);margin:4px 0 0}.bal small{margin-left:6px}
.sub{display:flex;gap:12px;font:500 12px var(--mono);color:var(--mute)}
#ret.up{color:var(--lime)} #ret.dn{color:var(--pink)}
.meter{height:5px;border-radius:3px;background:var(--panel2);margin-top:8px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--cyan);transition:width .4s}
.cap{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--mute);margin-top:3px}
  .needs{display:flex;gap:8px;margin-top:6px}.needs>div{flex:1;font:10px var(--mono);color:var(--mute)}.needs i{display:block;height:5px;background:var(--panel2);border-radius:3px;margin-top:2px;overflow:hidden}.needs i b{display:block;height:100%;width:0}
#tr{position:absolute;right:10px;top:var(--top);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.metrics{display:flex;gap:14px;padding:8px 12px;align-items:center}.metrics div{display:flex;flex-direction:column}.metrics b{font:700 14px var(--mono)}
.tabs{display:flex;gap:6px}.tabs button{padding:6px 10px}.tabs button.on{border-color:var(--cyan);color:var(--cyan)}
#mk{position:absolute;left:10px;top:calc(var(--top) + 146px);padding:8px 10px;width:190px;font:12px var(--mono)}
.tk{display:flex;justify-content:space-between;gap:8px;padding:2px 0}.tk b{font-weight:700}.pos{color:var(--lime)}.neg{color:var(--pink)}
.bar{height:4px;border-radius:2px;background:var(--panel2);margin:2px 0 6px;overflow:hidden}.bar i{display:block;height:100%}
#side{position:absolute;right:10px;top:calc(var(--top) + 86px);width:310px;max-height:calc(100% - 200px);overflow:auto;padding:10px;touch-action:pan-y}
.post{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.post .who{font-weight:700;color:var(--cyan)}.post.sys .who{color:var(--amber)}.post.bad .who{color:var(--pink)}.post time{float:right;color:var(--mute);font:10px var(--mono)}.post .lk{color:var(--mute);font:11px var(--mono)}
.sk{margin:8px 0}.sk .top{display:flex;justify-content:space-between}.sk.lock{opacity:.45}
.rk{display:flex;justify-content:space-between;padding:4px 0;font:12px var(--mono)}.rk.me{color:var(--cyan);font-weight:700}
#banner{position:absolute;left:50%;top:calc(var(--top) + 6px);transform:translateX(-50%);max-width:min(560px,70vw);padding:8px 14px;border-radius:8px;font-weight:700;text-align:center;background:var(--pink);color:#1a0010;z-index:5}
#banner.good{background:var(--lime);color:#0a1400}#banner.info{background:var(--cyan);color:#021018}
#prompt{position:absolute;left:50%;bottom:calc(var(--bot) + 14px);transform:translateX(-50%);padding:12px 22px;font-size:15px;z-index:4}
#joy{position:absolute;left:22px;bottom:calc(var(--bot) + 18px);width:120px;height:120px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 60%,transparent);touch-action:none;z-index:3}
#joy i{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:var(--cyan);opacity:.7}
#coach{position:absolute;left:50%;bottom:calc(var(--bot) + 70px);transform:translateX(-50%);padding:8px 14px;border-radius:8px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);color:var(--mute);font-size:12px;text-align:center;max-width:86vw;pointer-events:none}
#modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,5,10,.62);z-index:10;padding:12px}
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;touch-action:pan-y;background:var(--panel);border:1px solid var(--cyan);border-radius:12px;padding:16px;box-shadow:0 0 40px rgba(46,230,255,.18)}
.sheet h2{margin:0 0 4px;font-size:20px}.sheet p{margin:4px 0 10px;color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button.on{border-color:var(--cyan);color:var(--cyan)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.acts>*{flex:1 1 120px}
pre.code{margin:8px 0;padding:10px;background:#04060c;border:1px solid var(--line);border-radius:8px;font:12px/1.5 var(--mono);color:#b9f3ff;overflow:auto;white-space:pre}
canvas.chart{width:100%;height:120px;background:#04060c;border:1px solid var(--line);border-radius:8px;display:block}
.sig{display:grid;grid-template-columns:70px 1fr;gap:2px 8px;font:11px var(--mono);align-items:center;margin-top:6px}
.res{text-align:center;padding:14px 0}.res b{display:block;font:700 30px var(--mono)}.res.win b{color:var(--lime)}.res.loss b{color:var(--pink)}
#intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,7,14,.7);backdrop-filter:blur(3px);z-index:20;padding:16px}
#intro .sheet{text-align:center}#intro h1{margin:0;font-size:44px;letter-spacing:.04em;color:var(--cyan);text-shadow:0 0 18px rgba(46,230,255,.6)}
input[type=text]{font:600 16px var(--disp);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;box-sizing:border-box;margin:10px 0;user-select:text;-webkit-user-select:text}
.hint{font:11px/1.35 var(--disp);color:var(--mute);margin:4px 0}
.sig small{font-family:var(--disp)}.sig em{display:block;font:10px var(--disp);font-style:normal;color:var(--mute)}.sig{grid-template-columns:120px 1fr}
.bet{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-width:2px}
.bet .bt{display:flex;flex-direction:column}.bet b{font-size:16px}.bet small{font:11px/1.25 var(--disp);text-transform:none;letter-spacing:0;color:inherit;opacity:.85}
.bet.up{background:var(--lime);color:#0a1400;border-color:var(--lime)}.bet.dn{background:var(--pink);color:#1a0010;border-color:var(--pink)}
.bet .ico{width:30px;height:30px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none;border-radius:6px;background:rgba(0,0,0,.18)}
.bet .ar{display:block;line-height:0;animation:goUp 1.6s ease-in-out infinite}.bet .ar.d{animation-name:goDn}
@keyframes goUp{0%,15%{transform:translateY(0)}45%{transform:translateY(-34px)}46%{transform:translateY(34px)}75%,100%{transform:translateY(0)}}
@keyframes goDn{0%,15%{transform:translateY(0)}45%{transform:translateY(34px)}46%{transform:translateY(-34px)}75%,100%{transform:translateY(0)}}
.live{display:flex;align-items:center;gap:14px;margin:10px 0;position:relative}
.live .ring{width:84px;height:84px;transform:rotate(-90deg);flex:none}.ring circle{fill:none;stroke-width:8}.ring .bg{stroke:var(--panel2)}.ring .fg{stroke:var(--cyan);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.live #rnum{position:absolute;left:0;top:0;height:84px;line-height:84px;width:84px;text-align:center;font:700 30px var(--mono)}.big{font:700 26px var(--mono)}
.locks{display:flex;gap:8px;margin:8px 0}.lk2{flex:1;text-align:center;padding:6px;border:1px solid var(--line);border-radius:8px;font:700 12px var(--mono);color:var(--mute)}.lk2.now{border-color:var(--cyan);color:var(--cyan)}.lk2.ok{border-color:var(--lime);color:var(--lime)}
.vbar{position:relative;height:46px;border-radius:10px;background:#04060c;border:1px solid var(--line);margin:10px 0;overflow:hidden}
.vbar .zone{position:absolute;top:0;bottom:0;background:rgba(184,255,61,.35);border-left:2px solid var(--lime);border-right:2px solid var(--lime)}
.vbar .needle{position:absolute;top:0;bottom:0;width:6px;left:-3px;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}
.sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid var(--line)}.sw.on{border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan)}
.cz small{display:block;margin-top:6px}
#modal.low{background:transparent;align-items:flex-end;pointer-events:none}#modal.low .sheet{pointer-events:auto;max-height:52%;width:min(560px,100%)}
@media (prefers-reduced-motion:reduce){.bet .ar{animation:none}}
#phoneBtn{position:absolute;right:12px;bottom:calc(var(--bot) + 14px);z-index:4;padding:10px 18px;border-radius:20px;font-size:14px}
#phoneBtn[data-n]:not([data-n=""])::after{content:attr(data-n);margin-left:8px;background:var(--pink);color:#fff;border-radius:10px;padding:0 6px;font-size:12px}
.phonesheet{width:min(340px,100%);height:min(640px,100%);box-sizing:border-box;padding:0!important;border:6px solid #1c2440!important;border-radius:34px!important;display:flex;flex-direction:column;overflow:hidden!important;background:#070910!important}
.ph-bar{display:flex;justify-content:space-between;padding:8px 18px 4px;font:600 11px var(--mono);color:var(--mute)}
.ph-scr{flex:1;overflow:auto;padding:6px 12px;touch-action:pan-y;font-size:13px}.ph-scr .acts{margin-top:8px}
.ph-nav{display:flex;justify-content:center;padding:8px}.ph-nav button{width:90px;height:6px;padding:0;border-radius:3px;background:var(--mute);border:0}
.ph-h{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-size:17px}.ph-h button{padding:2px 10px;font-size:18px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;margin-top:10px}.ap{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--fg)}
.ap i{position:relative;width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font:700 22px var(--disp);font-style:normal;color:#06101a}.ap.soon{opacity:.45;cursor:default}
.ap u{position:absolute;top:-4px;right:-4px;background:var(--pink);color:#fff;border-radius:9px;padding:0 5px;font:700 11px var(--mono);text-decoration:none}
.cmp{display:flex;gap:6px;margin:8px 0}.cmp input{margin:0;flex:1;padding:8px 10px;font-size:14px}
button.lnk{all:unset;cursor:pointer;color:var(--cyan);font-weight:700}button.lk{display:inline-block;color:var(--mute);font:11px var(--mono);margin-top:3px}button.lk.liked{color:var(--pink)}
.pf{display:flex;gap:10px;align-items:center}.pf i{width:48px;height:48px;border-radius:50%;background:var(--cyan);color:#021018;display:flex;align-items:center;justify-content:center;font:700 22px var(--disp);font-style:normal}
.pstats{display:flex;gap:20px;margin:10px 0}.pstats span{display:flex;flex-direction:column}.pstats b{font:700 16px var(--mono)}
.msgs{display:flex;flex-direction:column;gap:6px;margin:8px 0}.m{max-width:82%;padding:6px 10px;border-radius:12px;background:var(--panel2);align-self:flex-start}.m small{display:block;color:var(--cyan);font-size:10px}.m.me{align-self:flex-end;background:var(--cyan);color:#021018}
.thr{all:unset;display:flex;flex-direction:column;width:100%;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}.thr span{color:var(--mute);font-size:12px}
.map{width:100%;border:1px solid var(--line);border-radius:10px;display:block}.loc{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.tx{display:grid;grid-template-columns:70px 1fr auto;gap:6px;padding:5px 0;border-bottom:1px solid var(--line);font:12px var(--mono)}.tx code{color:var(--mute)}
@media (max-width:700px){
  #tl{min-width:0;padding:7px 9px}.bal{font-size:20px}
  .metrics{gap:8px;padding:6px 8px}.metrics b{font-size:12px}
  #mk{top:auto;bottom:calc(var(--bot) + 150px);left:10px;width:160px;font-size:11px}
  #side{left:0;right:0;top:auto;bottom:0;width:auto;max-height:46%;border-radius:14px 14px 0 0;padding-bottom:var(--bot)}
  #banner{top:calc(var(--top) + 100px);max-width:90vw;font-size:13px}
  .cap span:last-child{margin-left:8px}
  #joy{bottom:calc(var(--bot) + 8px)} #coach{bottom:calc(var(--bot) + 140px)}
}
@media (prefers-reduced-motion:reduce){#gl.glitch{animation:none}}
</style>
<div id="app">
  <canvas id="gl" aria-label="3D city hub"></canvas>
  <div id="fx"></div>
  <section id="tl" class="card">
    <div class="row"><b id="pname">Newcomer</b><span id="role" class="tag">Newcomer</span><button id="styleBtn" style="padding:2px 8px;font-size:11px">Style</button></div>
    <div class="bal"><span id="bal">0</span><small>GD</small></div>
    <div class="sub"><span id="ret">+0.0%</span><span id="rep">Rep 0</span></div>
    <div class="meter"><i id="payBar"></i></div>
    <div class="cap"><span>Daily skill pay</span><span id="payTxt"></span></div>
    <div class="needs"><div><span>Energy <b id="enT"></b></span><i><b id="enB"></b></i></div><div><span>Hunger <b id="huT"></b></span><i><b id="huB"></b></i></div></div>
  </section>
  <section id="tr">
    <div class="card metrics">
      <div><small>Online</small><b id="mOn">0</b></div>
      <div><small>District</small><b id="mDist">0</b></div>
      <div><small>Visits</small><b id="mVis">0</b></div>
      <span class="tag demo" title="Simulated numbers in this prototype">Demo</span>
    </div>
    <div class="card" id="loc" style="padding:4px 12px;font:600 12px var(--mono);color:var(--cyan)"></div>
    <nav class="tabs">
      <button data-tab="skills">Skills</button><button data-tab="rank">Rank</button><button id="aboutBtn">About</button>
    </nav>
  </section>
  <section id="mk" class="card"></section>
  <aside id="side" class="card" hidden></aside>
  <button id="phoneBtn" class="pri" data-n="">Phone</button>
  <div id="banner" hidden></div>
  <button id="prompt" class="pri" hidden></button>
  <div id="joy" hidden><i></i></div>
  <div id="coach">Drag to look around. WASD or the stick to move. Step into a glowing ring, then press Use.</div>
  <div id="modal" hidden><div class="sheet" id="sheet"></div></div>
  <div id="intro">
    <div class="sheet">
      <h1>GLITCH</h1>
      <p>Become a glitch. Get rich. Rewrite the chain.</p>
      <label for="nameIn"><small>Your name</small></label>
      <input id="nameIn" type="text" maxlength="14" value="Newcomer" autocomplete="off">
      <p>Free to play. You start with 250,000 GD.</p>
      <button id="startBtn" class="pri" style="width:100%;padding:12px">Enter the city</button>
    </div>
  </div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const randn = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const fmt = n => { const a = Math.abs(n), s = n < 0 ? '-' : ''; if (a >= 1e9) return s + (a / 1e9).toFixed(2) + 'B'; if (a >= 1e6) return s + (a / 1e6).toFixed(2) + 'M'; if (a >= 1e3) return s + (a / 1e3).toFixed(a >= 1e5 ? 0 : 1) + 'K'; return s + Math.round(a); };
const fmtN = n => Math.round(n).toLocaleString('en-US');

/* ---------- renderer, scene, camera ---------- */
const lowEnd = (navigator.hardwareConcurrency || 4) <= 4 || matchMedia('(pointer:coarse)').matches;
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !lowEnd, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, lowEnd ? 1.25 : 1.75));
renderer.setClearColor(0x070910);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0f22, 0.017);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 400);
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
scene.add(new THREE.HemisphereLight(0x7088ff, 0x140a1e, 1.0));
const sun = new THREE.DirectionalLight(0x88aaff, 0.4); sun.position.set(-20, 40, 10); scene.add(sun);

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); draw(x, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 2;
  return { c, x, t, redraw(fn) { x.clearRect(0, 0, w, h); fn(x, w, h); t.needsUpdate = true; } };
}
const labelDraw = (text, col) => (x, w, h) => {
  x.font = '600 28px "Chakra Petch",sans-serif'; x.textAlign = 'center';
  const tw = Math.min(w - 8, x.measureText(text).width + 26);
  x.fillStyle = 'rgba(7,9,16,.7)'; x.fillRect(w / 2 - tw / 2, 8, tw, 48);
  x.fillStyle = col; x.fillText(text, w / 2, 44);
};
function label(text, col = '#e9eefc', scale = 1) {
  const t = canvasTex(256, 64, labelDraw(text, col));
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t.t, transparent: true, depthTest: false }));
  s.scale.set(4 * scale, scale, 1); s.renderOrder = 10; s.userData.tex = t; return s;
}
const relabel = (s, text, col = '#e9eefc') => s.userData.tex.redraw(labelDraw(text, col));

/* ---------- ground, skyline, buildings ---------- */
const groundTex = canvasTex(512, 512, (x, w, h) => {
  x.fillStyle = '#0a0e1a'; x.fillRect(0, 0, w, h); x.strokeStyle = '#17304a'; x.lineWidth = 3;
  for (let i = 0; i <= 8; i++) { x.beginPath(); x.moveTo(i * w / 8, 0); x.lineTo(i * w / 8, h); x.stroke(); x.beginPath(); x.moveTo(0, i * h / 8); x.lineTo(w, i * h / 8); x.stroke(); }
});
groundTex.t.wrapS = groundTex.t.wrapT = THREE.RepeatWrapping; groundTex.t.repeat.set(20, 20);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ map: groundTex.t }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);

const logoTex = canvasTex(512, 256, (x, w, h) => {
  x.font = '700 120px "Chakra Petch",sans-serif'; x.textAlign = 'center'; x.shadowColor = '#ff3d9a'; x.shadowBlur = 30;

/* ---------- Vault Cracker: a light timing game, just for fun ---------- */
function secGame() {
  let round = 0, hits = 0, p = 0, dir = 1, done = false, zone = [0, 0], last = performance.now(), busy = false;
  const ZW = [.24, .18, .13], SP = [.75, 1.0, 1.3];
  const onKey = e => { if ((e.key === ' ' || e.key === 'Enter') && !done) { e.preventDefault(); stop(); } };
  addEventListener('keydown', onKey);
  openModal('', () => { removeEventListener('keydown', onKey); });
  function setup() { zone = [rnd(.08, .92 - ZW[round]), ZW[round]]; busy = false; p = 0; dir = 1; render(); }
  function render() {
    sheet.dataset.lock = '1';
    sheet.innerHTML = `<h2>Vault Cracker</h2><p>A rich NPC left a vault open. Tap STOP (or press Space) when the glowing needle is inside the green zone.</p>
    <div class="locks">${[0, 1, 2].map(i => `<span class="lk2 ${i < round ? 'ok' : i === round ? 'now' : ''}">${i < round ? 'OPEN' : 'LOCK ' + (i + 1)}</span>`).join('')}</div>
    <div class="vbar"><i class="zone" style="left:${zone[0] * 100}%;width:${zone[1] * 100}%"></i><i class="needle" id="ndl"></i></div>
    <div class="hint">Each lock is faster and the green zone is smaller. Each open lock pays GD.</div>
    <div class="acts"><button class="pri" id="stopb" style="font-size:18px;padding:14px">STOP</button><button id="vx">Leave</button></div>`;
    $('#stopb').onclick = stop; $('#vx').onclick = () => { done = true; sheet.dataset.lock = ''; closeModal(); };
  }
  function stop() {
    if (done || busy) return; busy = true; const ok = p >= zone[0] && p <= zone[0] + zone[1]; if (ok) hits++;
    const n = $('#ndl'); if (n) n.style.background = ok ? '#b8ff3d' : '#ff3d9a'; round++;
    setTimeout(() => { if (done) return; if (round >= 3) end(); else setup(); }, 600);
  }
  function end() {
    done = true; clearInterval(modalTimer); const pay = hits * 15000 + (hits === 3 ? 30000 : 0), shd = hits + (hits === 3 ? 1 : 0); S.shards += shd; addXp('sec', 8 + hits * 6);
    const r = pay ? earn(pay) : { credited: 0, capped: false }; if (hits === 3) post('good', S.name, 'cracked a whole vault. smooth.'); save(); updateHud();
    resultCard(hits >= 2, hits ? '+' + fmtN(r.credited) + ' GD' : 'Locked out', `${hits} of 3 locks opened${hits === 3 ? '. PERFECT!' : ''}${shd ? ` · +${shd} shards` : ''}`, `I opened ${hits}/3 locks in the Glitch vault game.`);
  }
  modalTimer = setInterval(() => { const now = performance.now(), dt = (now - last) / 1000; last = now; if (busy || done) return; p += dir * SP[Math.min(round, 2)] * dt; if (p > 1) { p = 1; dir = -1; } if (p < 0) { p = 0; dir = 1; } const n = $('#ndl'); if (n) n.style.left = `calc(${p * 100}% - 3px)`; }, 16);
  setup();
}

/* ---------- Community: post a take, attention pays ---------- */
function commGame() {
  let tk = TOK[3], take = null; const cost = 10000;
  function render() {
    sheet.dataset.lock = '';
    sheet.innerHTML = `<h2>Attention Booth</h2><p>Boost a post for ${fmt(cost)} GD. Read the mood: hype works in greed, warnings work in fear, memes work any time (a bit less).</p>
    <div class="chips">${TOK.map(t => `<button data-t="${t.sym}" class="${t === tk ? 'on' : ''}">${t.sym}</button>`).join('')}</div>
    <div class="chips">${[['hype', `${tk.sym} to the moon`], ['warn', `careful: ${tk.sym} looks like a rug`], ['meme', `me explaining ${tk.sym} to my landlord`]].map(([k, l]) => `<button data-k="${k}" class="${take === k ? 'on' : ''}">${esc(l)}</button>`).join('')}</div>
    <small>Followers ${fmtN(S.followers)} · Community level ${L('comm')}</small>
    <div class="acts"><button class="pri" id="pst" ${take && S.bal >= cost ? '' : 'disabled'}>Post</button><button id="px">Cancel</button></div>`;
    sheet.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tk = TOK.find(t => t.sym === b.dataset.t); render(); });
    sheet.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { take = b.dataset.k; render(); });
    $('#px').onclick = closeModal; $('#pst').onclick = send;
  }
  function send() {
    burn(cost * 0.5); escrow(cost * 0.5); const m = market.mood, h = market.heat;
    const fit = take === 'hype' ? clamp(0.5 + m * 0.5 - h, 0, 1) : take === 'warn' ? clamp(0.3 + h * 2 - m * 0.3, 0, 1) : 0.45;
    const luck = Math.exp(randn() * 0.6), reach = fit * luck * (1 + 0.1 * (L('comm') - 1)) + 0.25;
    const pay = cost * 0.5 * (0.5 + reach * 1.6); const r = settle(cost * 0.5, pay - cost * 0.5);
    const fol = Math.floor(reach * 40 * (1 + L('comm') * .1)); S.followers += fol; S.stats.posts++; addXp('comm', 14); S.rep += reach > 1.2 ? 1 : 0;
    if (take === 'hype') { tk.hype = clamp(tk.hype + .06 * reach, 0, 1); tk.flow += .15 * reach; } else if (take === 'warn') { tk.trust = clamp(tk.trust - .05 * reach, 0, 1); tk.flow -= .1 * reach; }
    const txt = take === 'hype' ? `${tk.sym} to the moon` : take === 'warn' ? `careful: ${tk.sym} looks like a rug` : `me explaining ${tk.sym} to my landlord`;
    post('npc', S.name, txt); crowdTo('comm', 12); const viral = reach > 1.5;
    if (viral) post('sys', 'TRENDING', `${S.name}'s ${tk.sym} post is going viral.`);
    resultCard(r.credited >= 0, (r.credited >= 0 ? '+' : '') + fmt(r.credited) + ' GD', `${viral ? 'VIRAL. ' : ''}+${fol} followers`, `My ${tk.sym} take in Glitch ${viral ? 'went viral' : 'got ' + fol + ' new followers'}.`);
    save(); updateHud();
  }
  openModal(''); render();
}
